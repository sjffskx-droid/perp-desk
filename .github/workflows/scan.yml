name: scan
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py --once
        env:
          EXCHANGE: okx
          TF: 15m
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/signals.json
          git diff --cached --quiet || (git commit -m "update signals" && git push)
